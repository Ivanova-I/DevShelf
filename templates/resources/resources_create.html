
{% extends 'base.html' %}

{% block title %}Add Resource | DevShelf{% endblock %}

{% block content %}

<section class="form-page">

    <div class="form-header">
        <span class="badge">Developer Library</span>

        <h1>Add a Resource</h1>

        <p>
            Add a useful article, course, video, book or documentation
            page to your DevShelf library.
        </p>
    </div>


    <form method="post" class="resource-form">

        {% csrf_token %}

        {{ form.as_p }}

        <div class="form-actions">

            <a class="button secondary-button"
               href="{% url 'resources_home' %}">
                Cancel
            </a>

            <button type="submit">
                Add Resource
            </button>

        </div>

    </form>

</section>

{% endblock %}
