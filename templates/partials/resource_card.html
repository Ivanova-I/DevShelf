<article class="resource-card">

    <div class="resource-card-top">
        <span class="badge">{{ resource.resource_type }}</span>
        <span class="difficulty {{ resource.difficulty }}">{{ resource.difficulty }}</span>
    </div>

    <h2>{{ resource.title }}</h2>

    <p>{{ resource.description }}</p>

    <div class="resource-meta">
        <span>⏱ {{ resource.estimated_minutes }} min</span>
        <span>★ {{ resource.rating }}</span>
    </div>

    <div class="resource-card-footer">
        <span class="technology">{{ resource.technology.name }}</span>
        <a href="{% url 'resources_detail' resource.pk %}">View →</a>
    </div>

</article>
