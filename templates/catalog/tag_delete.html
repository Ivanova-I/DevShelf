{% extends 'base.html' %}

{% block title %}Delete {{ tag.name }} | DevShelf{% endblock %}

{% block content %}

<section class="delete-card card">

    <div class="form-header">
        <span class="badge">Resource Organization</span>

        <h1>Delete Tag</h1>

        <p>
            Are you sure you want to delete
            <strong>#{{ tag.name }}</strong>?
        </p>
    </div>

    <form method="post" class="resource-form">

        {% csrf_token %}

        <div class="form-actions">

            <a class="button secondary-button"
               href="{% url 'tag_home' %}">
                Cancel
            </a>

            <button type="submit" class="danger-button">
                Delete Tag
            </button>

        </div>

    </form>

</section>

{% endblock %}
