
{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}DevShelf{% endblock %}</title>

    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>

<body>

<header>
    <nav>
        <a href="{% url 'home' %}">DevShelf</a>
        <div>
            <a href="{% url 'catalog_home' %}">Catalog</a>
            <a href="{% url 'resources_home' %}">Resources</a>
            <a href="{% url 'learning_home' %}">Learning Paths</a>
            <a href="{% url 'note_home' %}">Notes</a>
        </div>
    </nav>
</header>

<main>
    {% block content %}
    {% endblock %}
</main>

<footer class="site-footer">

    <div class="site-footer-inner">

        <div>
            <strong>DevShelf</strong>
            <span>Developer Learning Library</span>
        </div>

        <div class="site-footer-right">
            <span>Created by Iva Ivanova</span>

            <a href="https://github.com/Ivanova-I"
               target="_blank"
               rel="noopener noreferrer">
                GitHub ↗
            </a>

            <span>© 2026</span>
        </div>

    </div>

</footer>

</body>
</html>
