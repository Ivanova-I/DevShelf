{% extends 'base.html' %}

{% block title %}Login | DevShelf{% endblock %}

{% block content %}

<div class="form-page">

    <div class="form-header">
        <span class="badge">DevShelf Account</span>
        <h1>Welcome back</h1>
        <p>Log in to continue your learning journey.</p>
    </div>

    <form method="post" class="resource-form">

        {% csrf_token %}

        {{ form.as_p }}

        <div class="form-actions">
            <button type="submit">Login</button>
        </div>

    </form>

</div>

{% endblock %}
