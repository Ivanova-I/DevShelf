{% extends 'base.html' %}

{% block title %}Create Account | DevShelf{% endblock %}

{% block content %}

<div class="form-page">

    <div class="form-header">
        <span class="badge">DevShelf Account</span>
        <h1>Create your account</h1>
        <p>Join DevShelf and start tracking your learning journey.</p>
    </div>

    <form method="post" class="resource-form">

        {% csrf_token %}

        {{ form.as_p }}

        <div class="form-actions">
            <button type="submit">Create Account</button>
        </div>

    </form>

</div>

{% endblock %}
