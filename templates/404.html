
{% extends 'base.html' %}

{% block title %}Page Not Found | DevShelf{% endblock %}

{% block content %}
    <svg viewBox="0 0 400 200" width="100%" style="max-width: 400px; display: block; margin: 0 auto;" role="img" aria-label="A cartoon bookshelf scene with books tipped over and one dizzy book lying flat">

    <line x1="20" y1="170" x2="380" y2="170" stroke="var(--border)" stroke-width="3"/>

    <rect x="50" y="70" width="28" height="100" rx="3" fill="var(--primary)"/>
    <rect x="300" y="85" width="28" height="85" rx="3" fill="var(--success)"/>

    <g transform="rotate(-18 110 150)">
        <rect x="95" y="60" width="28" height="100" rx="3" fill="var(--warning)"/>
    </g>

    <g transform="rotate(14 270 150)">
        <rect x="255" y="65" width="28" height="100" rx="3" fill="var(--danger)"/>
    </g>

    <g transform="rotate(-90 190 165) translate(40 0)">
        <rect x="150" y="145" width="100" height="36" rx="4" fill="var(--primary)"/>
    </g>

    <circle cx="178" cy="162" r="4" fill="var(--surface)"/>
    <circle cx="202" cy="162" r="4" fill="var(--surface)"/>
    <path d="M176 174 Q190 166 204 174" stroke="var(--surface)" stroke-width="2.5" fill="none" stroke-linecap="round"/>

    <text x="190" y="130" font-size="22" text-anchor="middle" fill="var(--text-muted)">?</text>

</svg>
    <h1 style="text-align: center; margin-top: 20px;">Oops — this page fell off the shelf.</h1>
<p style="text-align: center;">The page you're looking for doesn't exist.</p>
<p style="text-align: center;"><a href="{% url 'home' %}" class="button">Back to DevShelf</a></p>
{% endblock %}
